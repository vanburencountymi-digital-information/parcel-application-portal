name: Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Same Postgres major version as docker-compose.yml's `db` service.
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: parcel_application_portal
          POSTGRES_USER: parcel
          POSTGRES_PASSWORD: parcel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parcel -d parcel_application_portal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # Throwaway value — settings.py requires one, and nothing here is deployed.
      SECRET_KEY: ci-only-not-secret
      DATABASE_URL: postgres://parcel:parcel@localhost:5432/parcel_application_portal

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python manage.py test --settings=config.test_settings

  lint:
    runs-on: ubuntu-latest

    env:
      # mypy's Django plugin loads config.settings, which requires one.
      SECRET_KEY: ci-only-not-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - run: ruff format --check .

      - run: ruff check .

      - run: mypy .
