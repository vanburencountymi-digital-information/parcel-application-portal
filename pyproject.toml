[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "DJ",  # flake8-django
    "PLR2004",  # magic values in comparisons: use a named constant or enum, e.g. HTTPStatus
]
ignore = [
    "E501", # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Tests compare against literal expected values on purpose.
"**/tests/**" = ["PLR2004"]
"config/test_settings.py" = ["PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["config"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "environ.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# localflavor ships no type stubs.
module = "localflavor.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# crispy_forms ships no type stubs.
module = "crispy_forms.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# django_fsm_log ships no type stubs.
module = "django_fsm_log.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# parameterized ships no type stubs.
module = "parameterized.*"
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.semantic_release]
commit_parser = "conventional"
tag_format = "v{version}"
